<svg width="200" height="150" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="200" height="150" fill="#f0f8ff" stroke="#333" stroke-width="2"/>
  
  <!-- 标题 -->
  <text x="100" y="25" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#333">
    宿舍维修测试图片
  </text>
  
  <!-- 水龙头图标 -->
  <g transform="translate(50, 40)">
    <rect x="0" y="10" width="30" height="15" fill="#c0c0c0" stroke="#888" stroke-width="1"/>
    <rect x="25" y="5" width="8" height="25" fill="#c0c0c0" stroke="#888" stroke-width="1"/>
    <circle cx="37" cy="17.5" r="3" fill="#4169e1"/>
    <!-- 水滴 -->
    <ellipse cx="37" cy="30" rx="2" ry="3" fill="#4169e1"/>
    <ellipse cx="39" cy="35" rx="1.5" ry="2" fill="#4169e1"/>
  </g>
  
  <!-- 问题描述 -->
  <text x="100" y="55" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">
    水龙头漏水问题
  </text>
  
  <!-- 电灯图标 -->
  <g transform="translate(120, 40)">
    <circle cx="15" cy="15" r="12" fill="#fff200" stroke="#ffa500" stroke-width="2"/>
    <line x1="15" y1="3" x2="15" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="27" y1="15" x2="30" y2="15" stroke="#333" stroke-width="2"/>
    <line x1="15" y1="27" x2="15" y2="30" stroke="#333" stroke-width="2"/>
    <line x1="3" y1="15" x2="0" y2="15" stroke="#333" stroke-width="2"/>
    <!-- X标记表示不工作 -->
    <line x1="8" y1="8" x2="22" y2="22" stroke="#ff0000" stroke-width="3"/>
    <line x1="22" y1="8" x2="8" y2="22" stroke="#ff0000" stroke-width="3"/>
  </g>
  
  <!-- 问题描述 -->
  <text x="100" y="85" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">
    电灯不亮
  </text>
  
  <!-- 说明文字 -->
  <text x="100" y="110" text-anchor="middle" font-family="Arial" font-size="10" fill="#888">
    这是一个测试图片，包含常见的宿舍维修问题
  </text>
  
  <!-- 格式信息 -->
  <text x="100" y="125" text-anchor="middle" font-family="Arial" font-size="10" fill="#888">
    格式: SVG | 尺寸: 200x150
  </text>
  
  <!-- 时间戳 -->
  <text x="100" y="140" text-anchor="middle" font-family="Arial" font-size="8" fill="#aaa">
    测试时间: 2024-01-20
  </text>
</svg>